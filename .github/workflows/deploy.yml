name: deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VM_NAME: ${{ vars.GCP_VM_NAME }}
      VM_ZONE: ${{ vars.GCP_VM_ZONE }}
      VM_PROJECT: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy on VM
        env:
          REPO_DIR: /opt/mtg-helper
        run: |
          set -euo pipefail
          gcloud compute ssh "$VM_NAME" \
            --zone="$VM_ZONE" \
            --project="$VM_PROJECT" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash -s" <<'EOF'
          set -euo pipefail
          REPO_DIR=/opt/mtg-helper
          cd "$REPO_DIR"
          git fetch --quiet origin main
          git reset --hard origin/main
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --env-file .env.prod build frontend backend
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --env-file .env.prod up -d --remove-orphans
          docker image prune -f
          EOF
