name: Recommendation core (offline)

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/recommendation-core.yml
  push:
    branches-ignore: [main]
    paths:
      - backend/**
      - .github/workflows/recommendation-core.yml

permissions:
  contents: read

concurrency:
  group: recommendation-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline source-backed recommendation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: '3.13'
          enable-cache: 'false'
      - run: uv sync --frozen --extra dev
      - name: Check shared core
        run: |
          uv run --no-sync ruff check src/mtg_helper/services/recommendations
          uv run --no-sync ruff format --check src/mtg_helper/services/recommendations
          uv run --no-sync ty check src/mtg_helper/services/recommendations
      - name: Run preserved research and new app protocol checks without secrets or source caches
        run: |
          uv run --no-sync pytest -q -W error \
            tests/test_recommendation_core.py \
            tests/test_recommendation_strategy.py \
            tests/test_commander_discovery_luna_refined.py \
            tests/test_commander_discovery_refinement.py \
            tests/test_commander_discovery_sol_assessment.py \
            tests/test_commander_discovery_sol.py \
            tests/test_commander_discovery_run.py \
            tests/test_commander_discovery_check.py \
            tests/test_deck_recovery_check.py \
            tests/test_assistant_quality_eval.py \
            tests/test_new_cards_evidence.py
