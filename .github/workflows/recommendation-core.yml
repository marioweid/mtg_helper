name: Recommendation core (offline)

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/recommendation-core.yml
  push:
    branches-ignore: [main]
    paths:
      - backend/**
      - .github/workflows/recommendation-core.yml

permissions:
  contents: read

concurrency:
  group: recommendation-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline source-backed recommendation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: '3.13'
          enable-cache: 'false'
      - run: uv sync --frozen --extra dev
      - name: Check shared core
        run: |
          uv run --no-sync ruff check src/mtg_helper/services/recommendations
          uv run --no-sync ruff format --check src/mtg_helper/services/recommendations
          uv run --no-sync ty check src/mtg_helper/services/recommendations
      - name: Run offline checks without secrets or source caches
        run: uv run --no-sync pytest -q -W error -m no_db
