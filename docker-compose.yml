# Local development stack: Postgres + backend (--reload) + frontend
# (pnpm dev). Source dirs are mounted for hot-reload; data lives in
# Docker-managed named volumes (pgdata).
#
# Boot:        docker compose up -d --build
# Tail logs:   docker compose logs -f backend frontend
# Stop:        docker compose down
#
# Production uses a standalone Portainer-friendly stack with host-bound data,
# a production frontend build, and weekly Scryfall sync. See docker-compose.prod.yml.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mtg_helper
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: mtg_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/mtg_helper/sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg_helper"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override the localhost DATABASE_URL from backend/.env — inside the
      # container, the database lives at the ``postgres`` service hostname.
      DATABASE_URL: postgresql://mtg:mtg_dev@postgres:5432/mtg_helper
      # Test suite (docker compose exec backend uv run --extra dev pytest -q).
      TEST_DATABASE_URL: postgresql://mtg:mtg_dev@postgres:5432/mtg_helper_test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/lib:/app/lib
      - ./frontend/components:/app/components

volumes:
  pgdata:
