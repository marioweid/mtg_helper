# Local development stack: Postgres + Qdrant + backend (--reload) + frontend
# (pnpm dev). Source dirs are mounted for hot-reload; data lives in
# Docker-managed named volumes (pgdata, qdrantdata).
#
# Boot:        docker compose up -d --build
# Tail logs:   docker compose logs -f backend frontend
# Stop:        docker compose down
#
# Production layers an overlay on top to bind data to /srv/mtg-helper/data,
# strip host ports, swap env files, and add the Cloudflare Tunnel + weekly
# Scryfall sync. See docker-compose.prod.yml.

services:
  qdrant:
    image: qdrant/qdrant:v1.17
    restart: always
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./qdrant/production.yaml:/qdrant/config/production.yaml
      - qdrantdata:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mtg_helper
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: mtg_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/mtg_helper/sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg_helper"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override the localhost DATABASE_URL from backend/.env — inside the
      # container, the database lives at the ``postgres`` service hostname.
      DATABASE_URL: postgresql://mtg:mtg_dev@postgres:5432/mtg_helper
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend/src:/app/src

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/lib:/app/lib
      - ./frontend/components:/app/components

volumes:
  pgdata:
  qdrantdata:
