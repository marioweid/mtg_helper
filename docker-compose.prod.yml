# Portainer / production stack. This file is intentionally standalone: do not
# layer it on top of docker-compose.yml in Portainer. The Portainer stack parser
# does not reliably support Docker Compose's custom merge tags (!reset/!override),
# so prod repeats the service definitions explicitly.
#
# Portainer setup:
#   1. Create a Git stack that points at this repo and this compose path.
#   2. Set the environment variables listed in portainer.env.example in the
#      Portainer stack UI (or via the root .env file managed outside git).
#   3. Point your existing reverse proxy / Cloudflare Tunnel at the frontend
#      host port (defaults to http://127.0.0.1:3001).
#   4. Enable GitOps automatic updates, or use the stack webhook from your
#      repository's push webhook.

services:
  qdrant:
    image: qdrant/qdrant:v1.17
    restart: unless-stopped
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ${MTG_HELPER_DATA_DIR:-/srv/mtg-helper/data}/qdrant:/qdrant/storage

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtg_helper}
      POSTGRES_USER: ${POSTGRES_USER:-mtg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ${MTG_HELPER_DATA_DIR:-/srv/mtg-helper/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "mtg_helper.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mtg}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-mtg_helper}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
      GOOGLE_OAUTH_CLIENT_ID: ${AUTH_GOOGLE_ID:?AUTH_GOOGLE_ID must be set}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      QDRANT_URL: http://qdrant:6333
      ENABLE_OPTIMIZER: ${ENABLE_OPTIMIZER:-false}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    command: ["sh", "-c", "pnpm exec next start -p $${PORT:-3001}"]
    ports:
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3001}:${PORT:-3001}"
    environment:
      PORT: ${PORT:-3001}
      BACKEND_ORIGIN: http://backend:8000
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?AUTH_GOOGLE_ID must be set}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?AUTH_GOOGLE_SECRET must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_URL: ${AUTH_URL:?AUTH_URL must be set to your public https URL}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    depends_on:
      - backend

  # Weekly Scryfall refresh. Initial sync also runs on backend startup when the
  # cards table is empty.
  scryfall-sync:
    image: alpine/curl:latest
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
    entrypoint: >
      sh -c "
        echo 'Scryfall weekly sync cron started';
        while true; do
          echo 'Waiting for backend...';
          until curl -sf -o /dev/null http://backend:8000/health; do sleep 10; done;
          echo 'Kicking off refresh-all (sync + tag + embed) in background...';
          curl -sf --max-time 30 -X POST -H \"X-Internal-Token: $$INTERNAL_API_TOKEN\" http://backend:8000/api/v1/admin/refresh-all && echo 'Refresh kicked off' || echo 'Refresh kickoff failed';
          sleep 604800;
        done
      "
    depends_on:
      - backend
