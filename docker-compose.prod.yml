# Portainer / production stack. This file is intentionally standalone: do not
# layer it on top of docker-compose.yml in Portainer. The Portainer stack parser
# does not reliably support Docker Compose's custom merge tags (!reset/!override),
# so prod repeats the service definitions explicitly.
#
# Portainer setup:
#   1. Create a Git stack that points at this repo and this compose path.
#   2. Set the environment variables listed in portainer.env.example in the
#      Portainer stack UI (or via the root .env file managed outside git).
#   3. Point your existing reverse proxy / Cloudflare Tunnel at the frontend
#      host port (defaults to http://127.0.0.1:3001).
#   4. Enable GitOps automatic updates, or use the stack webhook from your
#      repository's push webhook.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "uvicorn",
        "mtg_helper.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      DATABASE_URL: ${MTG_DATABASE_URL:?Set MTG_DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      SCRYFALL_BULK_DATA_URL: ${SCRYFALL_BULK_DATA_URL:-https://api.scryfall.com/bulk-data}
      GOOGLE_OAUTH_CLIENT_ID: ${AUTH_GOOGLE_ID:?AUTH_GOOGLE_ID must be set}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      ASSAY_ENDPOINT: ${ASSAY_ENDPOINT:-}
      ASSAY_API_KEY: ${ASSAY_API_KEY:-}
      ASSAY_APPLICATION: ${ASSAY_APPLICATION:-}
      ENABLE_OPTIMIZER: ${ENABLE_OPTIMIZER:-false}
      ENABLE_NEW_CARDS_WORKER: ${ENABLE_NEW_CARDS_WORKER:-true}
    networks:
      - default
      - shared_database

  frontend:
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    command: ["sh", "-c", "pnpm exec next start -p $${PORT:-3001}"]
    ports:
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3001}:${PORT:-3001}"
    environment:
      PORT: ${PORT:-3001}
      BACKEND_ORIGIN: http://backend:8000
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?AUTH_GOOGLE_ID must be set}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?AUTH_GOOGLE_SECRET must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_URL: ${AUTH_URL:?AUTH_URL must be set to your public https URL}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    depends_on:
      - backend

  # Daily Scryfall discovery; full source refresh and tagging remain weekly.
  # Initial sync also runs on backend startup when the cards table is empty.
  scryfall-sync:
    image: alpine/curl:latest
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
    entrypoint: >
      sh -c "
        echo 'Scryfall daily sync cron started';
        day=0;
        while true; do
          echo 'Waiting for backend...';
          until curl -sf -o /dev/null http://backend:8000/health; do sleep 10; done;
          endpoint=sync-cards;
          if [ $$day -eq 0 ]; then endpoint=refresh-all; fi;
          echo 'Kicking off shared card refresh in background...';
          curl -sf --max-time 30 -X POST -H \"X-Internal-Token: $$INTERNAL_API_TOKEN\" http://backend:8000/api/v1/admin/$$endpoint && echo 'Refresh kicked off' || echo 'Refresh kickoff failed';
          day=$$((($$day + 1) % 7));
          sleep 86400;
        done
      "
    depends_on:
      - backend

networks:
  default:
  shared_database:
    external: true
