# Explicit opt-in: normal application writes immediately affect the hosted app.
# The local postgres service remains available for isolated tests only.
services:
  backend:
    environment:
      DATABASE_URL: ${LIVE_DATABASE_URL:?Set LIVE_DATABASE_URL in the ignored root .env}
      RUN_STARTUP_MAINTENANCE: "false"
      APP_ENV: live
      LOCAL_DEV_AUTH: "false"
  frontend:
    environment:
      APP_ENV: live
      LOCAL_DEV_AUTH: "false"
